[package]
name = "jgenesis-common-gg"
version = "0.15.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
clap = ["dep:clap"]
serde = ["dep:serde"]

[dependencies]
jgenesis-proc-macros = { package = "jgenesis-proc-macros-gg" , path = "../../common/jgenesis-proc-macros" }

bincode = { version = "2", features = ["derive"] }
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
clap = { version = "4", features = ["derive"], optional = true }
log = "0.4"
multiversion = "0.9"
rand = "0.10"
rustc-hash = "2"
serde = { version = "1", features = ["derive"], optional = true }
time = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

