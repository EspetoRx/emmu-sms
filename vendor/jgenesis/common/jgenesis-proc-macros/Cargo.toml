[package]
name = "jgenesis-proc-macros-sms"
version = "0.15.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[dev-dependencies]
bincode = { version = "2", features = ["derive"] }
jgenesis-common = { package = "jgenesis-common-sms" , path = "../../common/jgenesis-common" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
test-log = "0.2"
toml = "1"

