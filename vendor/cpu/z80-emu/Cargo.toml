[features]
default = []
bincode = ["dep:bincode"]

[dependencies]
jgenesis-common = { package = "jgenesis-common-gg" , path = "../../common/jgenesis-common" }

bincode = { version = "2", features = ["derive"], optional = true }
log = "0.4"

[dev-dependencies]
rand = "0.10"

